[workspace]
resolver = "2"

members = [
    "payment-stream",
    "distributor",
    "nft-stream",
    "planter"
    "dispute-arbiter",
    "nft-stream",
    "campaign-funding",
    "soulbound-badge",
    "planter",
    "timelock",
    "upgrade-proxy",
    "sponsor-crowdfunding",
    "sponsor-insurance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Fundable-Protocol/stellar_client"

[workspace.dependencies]
soroban-sdk = "=25.3.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
