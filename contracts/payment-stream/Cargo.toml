[package]
name = "payment-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Pin ed25519-dalek to 2.x so the whole dep tree stays on rand_core 0.6.
# soroban-env-host 22.1.3 uses >=2.0.0; 2.2.0 satisfies that and avoids the
# rand_core 0.6/0.10 conflict that breaks testutils compilation.
ed25519-dalek = "=2.2.0"
